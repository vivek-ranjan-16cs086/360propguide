name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, json, bcmath, gd, fileinfo, zip, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run unit tests
        run: php artisan test --testsuite=Unit

  deploy:
    name: Deploy to Hostinger
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FTP credentials
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::FTP credentials are missing. Add FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD under Settings > Secrets and variables > Actions (Secrets tab preferred), then re-run this workflow."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "FTP host: $FTP_SERVER"
          echo "FTP user: $FTP_USERNAME"

      - name: Check SSH credentials
        id: ssh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via FTP
        if: steps.ftp.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github*/**
            **/.gitignore
            **/.gitattributes
            **/.editorconfig
            **/.styleci.yml
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/package.json
            **/package-lock.json
            **/vite.config.js
            **/error_log
            **/.ftp-deploy-sync-state.json
            **/storage/logs/**
            **/storage/debugbar/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/firebase/**
            **/storage/app/public/**
            **/public/storage
            **/public/storage/**
            **/public/plugins/**
            **/public/dist/**
            **/public/frontend/libraries/**
            **/*.mmdb
            **/*.mp4
            **/.idea/**
            **/.vscode/**
            **/.cursor/**

      - name: Install PHP packages on live
        if: steps.ftp.outputs.configured == 'true' && steps.ssh.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST || secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.SSH_USERNAME || vars.SSH_USERNAME || secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD || vars.SSH_PASSWORD || secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          port: ${{ secrets.SSH_PORT || vars.SSH_PORT || 65002 }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -e
            if [ -d "$HOME/public_html" ]; then
              cd "$HOME/public_html"
            elif [ -d "$HOME/domains/360propguide.com/public_html" ]; then
              cd "$HOME/domains/360propguide.com/public_html"
            else
              echo "Could not find Laravel public_html directory"
              exit 1
            fi
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
            php artisan package:discover --ansi
