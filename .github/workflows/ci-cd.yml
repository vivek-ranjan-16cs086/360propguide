name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, ctype, json, bcmath, gd, fileinfo, zip, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run unit tests
        run: php artisan test --testsuite=Unit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          retention-days: 1
          if-no-files-found: ignore

  deploy:
    name: Deploy to Hostinger
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check FTP credentials
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::FTP credentials are missing. Add FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD under Settings > Secrets and variables > Actions (Secrets tab preferred), then re-run this workflow."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "FTP host: $FTP_SERVER"
          echo "FTP user: $FTP_USERNAME"

      - name: Download built assets
        if: steps.ftp.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build
        continue-on-error: true

      - name: Deploy via FTPS
        if: steps.ftp.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR || vars.FTP_SERVER_DIR || '/public_html/' }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.github*/**
            **/.gitignore
            **/.gitattributes
            **/.editorconfig
            **/.styleci.yml
            **/.env
            **/.env.*
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/error_log
            **/.ftp-deploy-sync-state.json
            **/storage/logs/**
            **/storage/debugbar/**
            **/storage/framework/cache/data/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/storage/app/firebase/**
            **/storage/app/public/**
            **/public/storage/**
            **/public/plugins/**
            **/*.mmdb
            **/*.mp4
            **/.idea/**
            **/.vscode/**
            **/.cursor/**
